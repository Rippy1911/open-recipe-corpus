name: Propose a source
description: A cookbook or recipe collection whose licence lets us share and change it.
title: "Source: "
labels: ["sources"]
body:
  - type: markdown
    attributes:
      value: |
        SOURCES.md lists the rules: a licence that allows sharing and changing commercially (CC BY-SA, CC BY, CC0, OGL), or the public domain in the US and in its own country.
  - type: input
    id: source
    attributes:
      label: Source
      description: A link to it.
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language
    validations:
      required: true
  - type: textarea
    id: licence
    attributes:
      label: Licence
      description: The licence and where the source states it (a link), or why it is in the public domain (year, author's death).
    validations:
      required: true
  - type: input
    id: size
    attributes:
      label: About how many recipes
