name: Report a mistake
description: A wrong amount, unit, step, translation or tag in a recipe.
title: "Mistake: "
labels: ["data-fix"]
body:
  - type: input
    id: recipe
    attributes:
      label: Recipe id
      description: Shown on the recipe in the cookbook, and in data/recipes.jsonl.
      placeholder: plwb:9356
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: en
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is wrong, and what it should be
    validations:
      required: true
